name: CI

on:
  push:
  pull_request:
  # "Run workflow" in the Actions tab redeploys main by hand
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"
      - uses: actions/cache@v4
        with:
          path: |
            backend/deps
            backend/_build
          key: mix-${{ runner.os }}-${{ hashFiles('backend/mix.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test

  backend-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      # GHCR names must be lowercase
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sms-gateway:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Every branch builds the image; only main pushes it for deployment
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Lints the scripts that run on the VPS
  deploy-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x deploy/*.sh

  # Deploys main to the VPS once every check passes (see "Deploying" in
  # README.md). Settings may be repository or `production` environment
  # variables; the job fails with a clear message if one is missing.
  deploy:
    needs: [backend, backend-image, deploy-scripts, mobile, frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.PHX_HOST }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.backend-image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # Variables or secrets, at repository or environment level
      - name: Check deploy settings
        env:
          VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || secrets.VPS_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || secrets.DEPLOY_PATH || '/opt/sms-gateway' }}
          HAS_KEY: ${{ secrets.VPS_SSH_KEY != '' }}
          HAS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS != '' }}
        run: |
          missing=""
          [ -n "$VPS_HOST" ] || missing="$missing VPS_HOST"
          [ -n "$VPS_USER" ] || missing="$missing VPS_USER"
          [ "$HAS_KEY" = true ] || missing="$missing VPS_SSH_KEY(secret)"
          [ "$HAS_KNOWN_HOSTS" = true ] || missing="$missing VPS_KNOWN_HOSTS(secret)"
          if [ -n "$missing" ]; then
            echo "::error::Deploy settings missing:$missing (see Deploying in README.md)"
            exit 1
          fi
          {
            echo "VPS_HOST=$VPS_HOST"
            echo "VPS_USER=$VPS_USER"
            echo "VPS_PORT=$VPS_PORT"
            echo "DEPLOY_PATH=$DEPLOY_PATH"
          } >> "$GITHUB_ENV"
          echo "Deploying $IMAGE to $VPS_USER@$VPS_HOST:$DEPLOY_PATH"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned host key: no trust-on-first-use from CI
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            Port $VPS_PORT
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Upload deploy files
        run: |
          ssh vps "mkdir -p '$DEPLOY_PATH/deploy'"
          scp deploy/docker-compose.yml deploy/Caddyfile deploy/backup.sh \
            deploy/deploy.sh deploy/.env.example "vps:$DEPLOY_PATH/deploy/"

      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | ssh vps "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh vps "cd '$DEPLOY_PATH/deploy' && chmod +x deploy.sh backup.sh && ./deploy.sh '$IMAGE'"

      - name: Log out of GHCR on the VPS
        if: always()
        run: ssh vps "docker logout ghcr.io" || true

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
