apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.smssender'
version = '1.0.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()

android {
  compileSdkVersion project.ext.has('compileSdkVersion') ? project.ext.compileSdkVersion : 35

  defaultConfig {
    minSdkVersion project.ext.has('minSdkVersion') ? project.ext.minSdkVersion : 26
    targetSdkVersion project.ext.has('targetSdkVersion') ? project.ext.targetSdkVersion : 35
    versionCode 1
    versionName "1.0.0"
  }

  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:${getKotlinVersion()}"
  implementation "androidx.core:core-ktx:1.13.1"
}
