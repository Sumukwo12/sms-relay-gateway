# Production deployment: the gateway behind Caddy, which gets and renews a
# TLS certificate automatically (the relay phone connects to
# wss://$PHX_HOST/phone/websocket).
#
#   cp .env.example .env   # then fill it in
#   docker compose up -d --build
services:
  backend:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/gateway.db
      # Caddy appends the real client IP to X-Forwarded-For
      TRUST_PROXY: "true"
    volumes:
      - gateway-data:/data
    expose:
      - "4000"
    # For a USB GSM modem (MODEM_ADAPTER=uart, MODEM_PORT=/dev/ttyUSB0):
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - backend
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  gateway-data:
  caddy-data:
  caddy-config:
